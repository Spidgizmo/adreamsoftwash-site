name: Temporary Next.js security bump

on:
  pull_request:
    branches:
      - feature/ads-bin-cleaning-launch
    paths:
      - ".github/workflows/temporary-next-security-bump.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'codex/begin-agent-2-for-ads-bin-cleaning'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/begin-agent-2-for-ads-bin-cleaning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install patched runtime dependencies
        run: |
          # Stay on the smaller Next 15 migration instead of jumping directly
          # from Next 14 to Next 16 immediately before launch. Next 15.5.21
          # contains the July 2026 Next.js security fixes, and React 19.2.6
          # contains the May 2026 React Server Components security fixes.
          npm install next@15.5.21 react@19.2.6 react-dom@19.2.6 nodemailer@9.0.4 postcss@latest --save-exact
          npm install eslint-config-next@15.5.21 @types/react@19 @types/react-dom@19 --save-dev --save-exact

      - name: Verify application and runtime dependencies
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit verified dependency upgrade
        run: |
          rm .github/workflows/temporary-next-security-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/temporary-next-security-bump.yml
          git commit -m "Upgrade framework and runtime dependencies"
          git push origin HEAD:codex/begin-agent-2-for-ads-bin-cleaning
