name: Temporary Next.js security bump

on:
  pull_request:
    branches:
      - feature/ads-bin-cleaning-launch
    paths:
      - ".github/workflows/temporary-next-security-bump.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'codex/begin-agent-2-for-ads-bin-cleaning'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/begin-agent-2-for-ads-bin-cleaning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install stable patched runtime dependencies
        run: |
          # Test only stable releases. Next 16.2.12 currently bundles vulnerable
          # PostCSS/Sharp versions, so force the current patched stable releases
          # through npm overrides and keep the change only if the complete app,
          # build, and production audit all succeed.
          npm install next@16.2.12 react@19.2.6 react-dom@19.2.6 nodemailer@9.0.4 postcss@8.5.25 sharp@0.35.3 --save-exact
          npm install eslint-config-next@16.2.12 eslint@9.39.5 @types/react@19 @types/react-dom@19 --save-dev --save-exact
          npm pkg set 'overrides.next.postcss=8.5.25' 'overrides.next.sharp=0.35.3'
          npm install
          npm pkg set scripts.lint="eslint ."
          cat > eslint.config.mjs <<'EOF'
          import nextConfig from "eslint-config-next/core-web-vitals";

          // React 19's current recommended hooks preset also surfaces React
          // Compiler optimization diagnostics. Affected components can be
          // improved incrementally; preserve Rules-of-Hooks/exhaustive-deps as
          // errors while keeping compiler-only diagnostics visible as warnings.
          const compilerDiagnostics = [
            "component-hook-factories",
            "config",
            "error-boundaries",
            "gating",
            "globals",
            "immutability",
            "incompatible-library",
            "preserve-manual-memoization",
            "purity",
            "refs",
            "set-state-in-effect",
            "set-state-in-render",
            "static-components",
            "unsupported-syntax",
            "use-memo",
          ];

          const eslintConfig = [
            ...nextConfig,
            {
              rules: Object.fromEntries(
                compilerDiagnostics.map((rule) => [`react-hooks/${rule}`, "warn"]),
              ),
            },
          ];

          export default eslintConfig;
          EOF
          rm .eslintrc.json

      - name: Verify application and runtime dependencies
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit verified dependency upgrade
        run: |
          rm .github/workflows/temporary-next-security-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs .eslintrc.json .github/workflows/temporary-next-security-bump.yml
          git commit -m "Upgrade framework and runtime dependencies"
          git push origin HEAD:codex/begin-agent-2-for-ads-bin-cleaning
