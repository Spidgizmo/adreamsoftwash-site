name: Temporary Next.js security bump

on:
  pull_request:
    branches:
      - feature/ads-bin-cleaning-launch
    paths:
      - ".github/workflows/temporary-next-security-bump.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dependencies:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'codex/begin-agent-2-for-ads-bin-cleaning'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/begin-agent-2-for-ads-bin-cleaning
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install stable patched runtime dependencies
        run: |
          # The latest Next 15 Maintenance LTS backport still fails npm audit
          # because of high-severity PostCSS and Sharp advisories bundled through
          # Next. Test the current stable Next 16 line instead of npm's suggested
          # 16.3.0 preview. Nothing is committed unless the complete verification
          # below succeeds.
          npm install next@16.2.12 react@19.2.6 react-dom@19.2.6 nodemailer@9.0.4 postcss@latest --save-exact
          npm install eslint-config-next@16.2.12 eslint@9.39.5 @types/react@19 @types/react-dom@19 --save-dev --save-exact
          npm pkg set scripts.lint="eslint ."
          cat > eslint.config.mjs <<'EOF'
          import nextConfig from "eslint-config-next/core-web-vitals";

          const eslintConfig = [
            ...nextConfig,
          ];

          export default eslintConfig;
          EOF
          rm .eslintrc.json

      - name: Verify application and runtime dependencies
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Commit verified dependency upgrade
        run: |
          rm .github/workflows/temporary-next-security-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json eslint.config.mjs .eslintrc.json .github/workflows/temporary-next-security-bump.yml
          git commit -m "Upgrade framework and runtime dependencies"
          git push origin HEAD:codex/begin-agent-2-for-ads-bin-cleaning
